<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Froggy and Jumper Explore the World</title>
  <link rel="icon" type="image/png" href="globe.png">
  <script>
    // Apply saved theme before paint to avoid a flash
    (function () {
      var t = localStorage.getItem("fj_theme") ||
        (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- LOGIN -->
  <main id="login">
    <section class="login-card">
      <img class="logo" src="globe.png" alt="">
      <h1>Froggy <em>&amp;</em> Jumper</h1>
      <p class="sub">Explore the world</p>
      <form id="login-form">
        <label for="pw">Password</label>
        <input id="pw" type="password" autocomplete="current-password" required autofocus>
        <button type="submit" class="primary">Open</button>
      </form>
      <p id="login-error" class="error" hidden>Incorrect password.</p>
    </section>
  </main>

  <!-- APP -->
  <div id="app" hidden>
    <header id="appbar">
      <img class="logo small" src="globe.png" alt="">
      <span class="app-name">Froggy and Jumper Explore the World</span>
      <div class="bar-actions">
        <span id="sync-status"></span>
        <button id="theme-toggle" class="flat" title="Switch light / dark mode">Dark mode</button>
        <button id="logout" class="flat">Log out</button>
      </div>
    </header>

    <div id="toolbar" class="toolbar">
      <select id="block" title="Text style">
        <option value="p">Normal text</option>
        <option value="h2">Heading</option>
        <option value="h3">Subheading</option>
      </select>
      <span class="sep"></span>
      <button data-cmd="bold" title="Bold"><b>B</b></button>
      <button data-cmd="italic" title="Italic"><i>I</i></button>
      <button data-cmd="underline" title="Underline"><u>U</u></button>
      <span class="sep"></span>
      <button data-cmd="insertUnorderedList" title="Bulleted list">Bullets</button>
      <button data-cmd="insertOrderedList" title="Numbered list">Numbers</button>
      <button id="add-check" title="Checklist item">Checklist</button>
      <span class="sep"></span>
      <select id="color" title="Text colour">
        <option value="">Text colour</option>
        <option value="#d6586a">Red</option>
        <option value="#7c5cc4">Purple</option>
        <option value="default">Default</option>
      </select>
      <span class="lbl">Highlight</span>
      <button class="swatch red" data-hl="red" title="Highlight red"></button>
      <button class="swatch purple" data-hl="purple" title="Highlight purple"></button>
      <button data-hl="none" class="small" title="Remove highlight">Clear</button>
      <span class="sep"></span>
      <button id="add-comment" title="Comment on the selected text">Comment</button>
      <span class="grow"></span>
      <button id="delete-tab" class="danger" title="Delete this tab">Delete tab</button>
    </div>

    <div id="body">
      <aside id="sidebar">
        <button id="new-tab" class="flat">+ New tab</button>
        <nav id="tabs"></nav>
      </aside>

      <section id="canvas">
        <button id="menu-btn" class="flat">Tabs</button>
        <p id="empty" hidden>No tabs yet. Create one with "+ New tab".</p>
        <div id="sheet" hidden>
          <article id="page">
            <input id="doc-title" placeholder="Untitled" maxlength="60">
            <div id="embed-wrap" hidden></div>
            <div id="editor" contenteditable="true" spellcheck="true"></div>
          </article>
          <aside id="comments" hidden>
            <form id="composer" hidden>
              <textarea id="comment-text" rows="3" placeholder="Write a comment"></textarea>
              <div class="row">
                <select id="who" title="Posting as"><option>Jumper</option><option>Froggy</option></select>
                <span class="grow"></span>
                <button type="button" id="comment-cancel" class="small">Cancel</button>
                <button type="submit" class="primary tiny">Comment</button>
              </div>
            </form>
            <div id="comment-list"></div>
          </aside>
        </div>
      </section>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
